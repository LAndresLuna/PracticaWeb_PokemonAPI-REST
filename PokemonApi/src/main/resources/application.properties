spring.application.name=PokemonApi

# Configuración de conexión a la base de datos MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/pokemon_api_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=itson

#Driver de MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 'update' le dice a Hibernate que cree las tablas mágicamente
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
